<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EC">
<title>สมุดประจำรถ · TSM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B08D2E' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Ccircle cx='12' cy='12' r='2.5'/%3E%3Cpath d='M12 14.5V21M9.6 11.3 3.4 9.6M14.4 11.3l6.2-1.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* โลกของสมุดประจำรถ: กระดาษครีม หมึกน้ำตาลเข้ม ทองของแบรนด์ ฟ้าน้ำแข็งเป็นสีรอง */
    --paper:#FAF6EC; --card:#FFFFFF; --inset:#F6F1E4;
    --ink:#2B2415; --ink-2:#5C5340; --ink-3:#8A7F65; --ink-4:#B9AF97;
    --rule:rgba(43,36,21,.09); --rule-2:rgba(43,36,21,.16);
    --gold:#B08D2E; --gold-deep:#8C6F1F; --gold-wash:rgba(176,141,46,.10);
    --frost:#3A78B0;                       /* ชุดข้อมูลที่ 2 ในกราฟ (ซ่อมบำรุง) */
    --ok:#3E7C4F; --warn:#B7791F; --danger:#B3402E;
    --lift:0 0 0 1px rgba(43,36,21,.06), 0 1px 2px -1px rgba(43,36,21,.08), 0 6px 16px -8px rgba(43,36,21,.10);
    --r-s:10px; --r-m:16px; --r-l:22px;
    --ease:cubic-bezier(.23,1,.32,1);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; }
  body {
    font-family:'Prompt','Leelawadee UI','Noto Sans Thai',system-ui,sans-serif; font-weight:400; font-size:15px; line-height:1.5;
    background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  [hidden], .hidden { display:none !important; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  h1, h2, h3 { margin:0; font-weight:600; letter-spacing:-.01em; text-wrap:balance; }
  p { margin:0; text-wrap:pretty; }
  .num { font-variant-numeric:tabular-nums; }
  .label { font-size:12px; font-weight:500; color:var(--ink-3); letter-spacing:.02em; }
  .meta { font-size:13px; color:var(--ink-3); }

  /* ---------- controls ---------- */
  .btn {
    position:relative; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    min-height:44px; padding:0 18px; border-radius:var(--r-s); border:1px solid var(--rule-2);
    background:var(--card); font-weight:500; font-size:15px; white-space:nowrap;
    transition:transform .12s var(--ease), background-color .15s, border-color .15s;
  }
  .btn:hover { border-color:var(--ink-4); }
  .btn:active { transform:scale(.97); }
  .btn:disabled { opacity:.55; cursor:default; transform:none; }
  .btn.primary { background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .btn.primary:hover { background:#3A311F; }
  .btn.gold { background:var(--gold); border-color:var(--gold); color:#fff; }
  .btn.ghost { border-color:transparent; background:transparent; color:var(--ink-2); }
  .btn.ghost:hover { background:var(--gold-wash); }
  .btn.danger { color:var(--danger); border-color:color-mix(in srgb, var(--danger) 30%, transparent); }
  .btn.armed { background:var(--danger); border-color:var(--danger); color:#fff; }
  .btn.block { width:100%; min-height:50px; font-size:16px; }
  .btn.sm { min-height:36px; padding:0 12px; font-size:13px; }
  .btn.busy { color:transparent !important; }
  .btn.busy::after {
    content:''; position:absolute; width:18px; height:18px; border-radius:50%;
    border:2px solid currentColor; border-color:var(--ink-4) var(--ink-4) var(--ink-4) transparent; animation:spin .7s linear infinite;
  }
  .btn.primary.busy::after, .btn.gold.busy::after { border-color:rgba(255,255,255,.85) rgba(255,255,255,.85) rgba(255,255,255,.85) transparent; }
  @keyframes spin { to { transform:rotate(360deg); } }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

  .field { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .field > span { font-size:13px; font-weight:500; color:var(--ink-2); }
  .field > span i { font-style:normal; font-weight:400; color:var(--ink-3); }
  .input, .field input, .field select, .field textarea {
    width:100%; min-height:48px; padding:10px 14px; border-radius:var(--r-s);
    border:1px solid var(--rule); background:var(--inset); font-size:16px; outline:none;
    transition:border-color .15s, box-shadow .15s, background-color .15s;
  }
  .field textarea { min-height:84px; resize:vertical; }
  .input:focus, .field input:focus, .field select:focus, .field textarea:focus {
    border-color:var(--gold); background:var(--card); box-shadow:0 0 0 3px var(--gold-wash);
  }
  .field input[readonly] { color:var(--ink-3); background:transparent; }
  .row2 { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; }

  .seg { display:flex; padding:4px; gap:4px; background:var(--inset); border:1px solid var(--rule); border-radius:calc(var(--r-s) + 4px); }
  .seg button, .seg label {
    position:relative; flex:1; min-height:40px; border:0; border-radius:var(--r-s); background:transparent; font-size:14px; font-weight:500;
    color:var(--ink-3); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background-color .15s, color .15s;
  }
  .seg input { position:absolute; opacity:0; pointer-events:none; }
  .seg button.on, .seg label:has(input:checked) { background:var(--card); color:var(--ink); box-shadow:var(--lift); }

  .card { background:var(--card); border-radius:var(--r-m); box-shadow:var(--lift); }
  .form { padding:20px; display:flex; flex-direction:column; gap:16px; }

  /* ---------- ป้ายทะเบียน (ลายเซ็นของแอป: รถทุกคันแทนด้วยป้ายจริง) ---------- */
  .plate {
    display:inline-flex; flex-direction:column; align-items:center; justify-content:center; flex:none;
    min-width:112px; padding:7px 14px 6px; border-radius:9px; background:#fff; color:var(--ink);
    border:1.5px solid var(--ink); box-shadow:inset 0 0 0 2.5px #fff, inset 0 0 0 3.5px rgba(43,36,21,.28);
    line-height:1.15; text-align:center; transition:transform .12s var(--ease), border-color .15s, box-shadow .15s;
  }
  .plate b { font-size:18px; font-weight:600; letter-spacing:.03em; white-space:nowrap; }
  .plate small { font-size:11px; color:var(--ink-3); max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plate.sm { min-width:0; padding:4px 9px 3px; border-radius:7px; }
  .plate.sm b { font-size:14px; }
  .plate.sm small { display:none; }
  button.plate:active { transform:scale(.97); }
  button.plate.on { border-color:var(--gold); box-shadow:inset 0 0 0 2.5px #fff, inset 0 0 0 3.5px var(--gold), 0 6px 16px -8px rgba(176,141,46,.6); }
  button.plate.on b { color:var(--gold-deep); }

  /* หน้าปัดเลขไมล์ */
  .odo { display:inline-flex; gap:3px; font-family:'IBM Plex Mono',ui-monospace,monospace; }
  .odo i {
    font-style:normal; width:1.18em; height:1.6em; display:grid; place-items:center; border-radius:5px;
    background:var(--ink); color:#F3E7C4; font-size:22px; box-shadow:inset 0 -1px 0 rgba(255,255,255,.08), inset 0 1px 0 rgba(0,0,0,.4);
  }
  .odo i:last-child { background:var(--gold); color:#fff; }

  /* มาตรรอบบำรุงรักษา (เหมือนสติกเกอร์เปลี่ยนน้ำมันเครื่องหน้ากระจก) */
  .meter { display:flex; flex-direction:column; gap:8px; }
  .meter-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:13px; color:var(--ink-3); }
  .meter-head b { font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .track { height:6px; border-radius:99px; background:color-mix(in srgb, var(--ok) 14%, transparent); overflow:hidden; }
  .fill { height:100%; border-radius:99px; background:var(--ok); transform-origin:left; animation:grow .6s var(--ease) both; }
  .meter.warn .track { background:color-mix(in srgb, var(--warn) 16%, transparent); } .meter.warn .fill { background:var(--warn); }
  .meter.danger .track { background:color-mix(in srgb, var(--danger) 14%, transparent); } .meter.danger .fill { background:var(--danger); }
  .meter.warn .meter-head b { color:var(--warn); } .meter.danger .meter-head b { color:var(--danger); }
  @keyframes grow { from { transform:scaleX(0); } }

  /* ---------- login ---------- */
  .login { min-height:100dvh; display:grid; place-items:center; padding:24px 16px; }
  .login-card { width:100%; max-width:380px; padding:36px 28px 28px; display:flex; flex-direction:column; gap:16px; }
  .emblem { width:56px; height:56px; border-radius:16px; display:grid; place-items:center; background:var(--ink); color:var(--gold); margin-bottom:8px; }
  .login h1 { font-size:29px; }
  .login .sub { color:var(--ink-3); margin-top:-10px; margin-bottom:8px; }
  .err { color:var(--danger); font-size:14px; min-height:21px; }
  .splash { min-height:100dvh; display:grid; place-items:center; text-align:center; color:var(--ink-3); gap:12px; align-content:center; }

  /* ---------- shell ---------- */
  .top {
    position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:12px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px; background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--rule);
  }
  .top .brand { display:flex; align-items:center; gap:10px; flex:1; min-width:0; font-weight:600; }
  .top .brand span { width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:var(--ink); color:var(--gold); flex:none; }
  .me { display:flex; align-items:center; gap:8px; border:1px solid var(--rule); background:var(--card); border-radius:99px; padding:4px 12px 4px 4px; font-size:14px; max-width:55%; }
  .me b { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .av { width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--gold-wash); color:var(--gold-deep); font-weight:600; font-size:13px; }
  main { max-width:760px; margin:0 auto; padding:20px 16px calc(96px + env(safe-area-inset-bottom)); }
  .view { display:none; flex-direction:column; gap:16px; }
  .view.active { display:flex; animation:enter .28s var(--ease); }
  @keyframes enter { from { opacity:0; transform:translateY(6px); } }
  .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .page-head h2 { font-size:23px; }
  .page-head .meta { margin-top:2px; }
  .page-head .input { width:auto; min-height:42px; padding:6px 12px; font-size:15px; background:var(--card); }

  .tabs {
    position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex; justify-content:center;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--rule);
  }
  .tabs button {
    flex:1; max-width:140px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 4px; min-height:52px;
    border:0; background:none; color:var(--ink-3); font-size:12px; font-weight:500; border-radius:12px; transition:color .15s;
  }
  .tabs button svg { width:24px; height:24px; }
  .tabs button.on { color:var(--gold-deep); }
  .tabs button.on svg { stroke-width:2.1; }

  /* ---------- record ---------- */
  .plates { display:flex; gap:10px; overflow-x:auto; padding:4px 2px 10px; margin:0 -16px; padding-inline:16px; scrollbar-width:none; scroll-snap-type:x proximity; }
  .plates::-webkit-scrollbar { display:none; }
  .plates .plate { scroll-snap-align:start; }
  .vehicle { padding:20px; display:flex; flex-direction:column; gap:18px; }
  .vehicle-top { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .vehicle-top .label { display:block; margin-bottom:8px; }
  .calc { display:flex; align-items:baseline; justify-content:space-between; padding:12px 14px; border-radius:var(--r-s); background:var(--gold-wash); color:var(--ink-2); font-size:14px; }
  .calc b { font-size:19px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .calc.bad b { color:var(--danger); }
  .quick { display:flex; gap:8px; flex-wrap:wrap; }
  form:has(input[name=kind][value="ซ่อม"]:checked) .only-service { display:none; }
  .empty { padding:40px 24px; text-align:center; color:var(--ink-3); display:flex; flex-direction:column; align-items:center; gap:10px; }
  .empty svg { width:40px; height:40px; color:var(--ink-4); }
  .empty b { color:var(--ink-2); font-weight:500; }

  /* ---------- lists ---------- */
  .filters { display:flex; flex-direction:column; gap:12px; }
  .filters .row2 .input { background:var(--card); }
  .sum { display:flex; justify-content:space-between; align-items:baseline; padding:0 4px; color:var(--ink-3); font-size:14px; }
  .sum b { color:var(--ink); font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
  .list { display:flex; flex-direction:column; }
  .list > .item + .item { border-top:1px solid var(--rule); }
  .item { display:flex; gap:14px; align-items:flex-start; padding:14px 18px; text-align:left; width:100%; border:0; background:none; }
  button.item:hover { background:color-mix(in srgb, var(--gold-wash) 50%, transparent); }
  .item-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .item-title { font-weight:500; overflow-wrap:anywhere; }
  .item-side { display:flex; flex-direction:column; align-items:flex-end; gap:6px; text-align:right; flex:none; }
  .item-side b { font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .date-tile { flex:none; width:44px; text-align:center; line-height:1.1; padding-top:2px; }
  .date-tile b { display:block; font-size:19px; font-weight:600; }
  .date-tile small { font-size:11px; color:var(--ink-3); }
  .tag { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:500; padding:2px 8px; border-radius:99px; background:var(--inset); color:var(--ink-2); white-space:nowrap; }
  .tag.gold { background:var(--gold-wash); color:var(--gold-deep); }
  .tag.warn { background:color-mix(in srgb, var(--warn) 13%, transparent); color:var(--warn); }
  .tag.danger { background:color-mix(in srgb, var(--danger) 11%, transparent); color:var(--danger); }
  .skeleton { height:68px; margin:12px 18px; border-radius:var(--r-s); background:linear-gradient(90deg, var(--inset), #FBF8F0, var(--inset)); background-size:200% 100%; animation:shine 1.2s linear infinite; }
  @keyframes shine { to { background-position:-200% 0; } }

  /* ---------- dashboard ---------- */
  .hero { padding:24px 22px; display:flex; flex-direction:column; gap:6px; }
  .hero-num { font-size:46px; font-weight:600; letter-spacing:-.025em; line-height:1.1; }
  .hero-num small { font-size:23px; font-weight:400; color:var(--ink-3); margin-left:4px; letter-spacing:0; }
  .split { display:flex; gap:6px 20px; flex-wrap:wrap; font-size:14px; color:var(--ink-3); }
  .split b { color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; }
  .key { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:baseline; }
  .key.fuel { background:var(--gold); } .key.repair { background:var(--frost); }
  .stats { display:grid; grid-template-columns:repeat(4, 1fr); margin-top:18px; padding-top:16px; border-top:1px solid var(--rule); gap:12px; }
  .stats div { display:flex; flex-direction:column; min-width:0; }
  .stats b { font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; }
  .stats small { font-size:12px; color:var(--ink-3); }
  .alerts { display:flex; flex-direction:column; gap:8px; }
  .alert { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:var(--r-s); background:var(--card); box-shadow:var(--lift); font-size:14px; }
  .alert svg { width:20px; height:20px; flex:none; }
  .alert.warn svg { color:var(--warn); } .alert.danger svg { color:var(--danger); }
  .alert b { font-weight:600; white-space:nowrap; }
  .alert span { color:var(--ink-2); }
  .section { padding:20px; display:flex; flex-direction:column; gap:16px; }
  .section-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .section-head h3 { font-size:17px; }
  .legend { display:flex; gap:16px; font-size:13px; color:var(--ink-2); }

  .chart { position:relative; height:200px; display:grid; grid-template-columns:auto 1fr; gap:10px; }
  .y-axis { position:relative; width:34px; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .y-axis span { position:absolute; right:0; transform:translateY(50%); }
  .plot { position:relative; display:flex; align-items:stretch; }
  .grid-line { position:absolute; left:0; right:0; height:1px; background:var(--rule); }
  .col { position:relative; flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; border:0; background:none; padding:0; z-index:1; }
  .col .stack { width:min(24px, 60%); display:flex; flex-direction:column; gap:2px; min-height:0; transition:opacity .15s; }
  .col .stack > i { display:block; min-height:2px; }
  .col .stack > i:first-child { border-radius:4px 4px 0 0; }
  .col .stack .fuel { background:var(--gold); } .col .stack .repair { background:var(--frost); }
  .col .cap { position:absolute; font-size:12px; font-weight:600; color:var(--ink); transform:translateY(-100%); padding-bottom:4px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .plot:hover .col .stack, .plot:focus-within .col .stack { opacity:.45; }
  .plot .col:hover .stack, .plot .col:focus .stack { opacity:1; }
  .x-axis { display:flex; margin-left:44px; font-size:12px; color:var(--ink-3); }
  .x-axis span { flex:1; text-align:center; }
  .x-axis span.on { color:var(--ink); font-weight:600; }
  .tip {
    position:absolute; z-index:5; pointer-events:none; min-width:150px; padding:10px 12px; border-radius:var(--r-s);
    background:var(--ink); color:var(--paper); font-size:13px; line-height:1.6; box-shadow:0 8px 24px -8px rgba(43,36,21,.5);
    transform:translate(-50%, -100%); opacity:0; transition:opacity .12s;
  }
  .tip.show { opacity:1; }
  .tip b { font-weight:600; } .tip .r { display:flex; justify-content:space-between; gap:14px; font-variant-numeric:tabular-nums; }
  details summary { cursor:pointer; font-size:13px; color:var(--ink-3); list-style:none; }
  details summary::-webkit-details-marker { display:none; }
  details summary::before { content:'▸ '; } details[open] summary::before { content:'▾ '; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; font-variant-numeric:tabular-nums; }
  th, td { padding:8px 6px; text-align:right; border-bottom:1px solid var(--rule); }
  th:first-child, td:first-child { text-align:left; }
  th { font-weight:500; color:var(--ink-3); }

  .veh { display:flex; flex-direction:column; gap:12px; padding:18px 0; }
  .veh + .veh { border-top:1px solid var(--rule); }
  .veh:first-child { padding-top:4px; } .veh:last-child { padding-bottom:0; }
  .veh-top { display:flex; align-items:center; gap:12px; }
  .veh-top .item-main { gap:0; }
  .veh-nums { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; font-size:12px; color:var(--ink-3); }
  .veh-nums b { display:block; font-size:15px; color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; }

  /* ---------- admin ---------- */
  .adm-bar { display:flex; gap:12px; align-items:center; }
  .adm-bar .seg { flex:1; }
  .checks { display:flex; flex-wrap:wrap; gap:8px; }
  .check { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 14px; border-radius:99px; border:1px solid var(--rule-2); font-size:14px; cursor:pointer; user-select:none; }
  .check input { accent-color:var(--gold); width:16px; height:16px; margin:0; }
  .check:has(input:checked) { border-color:var(--gold); background:var(--gold-wash); color:var(--gold-deep); }

  dialog {
    width:min(520px, calc(100vw - 24px)); max-height:calc(100dvh - 32px); padding:0; border:0; border-radius:var(--r-l);
    background:var(--card); color:var(--ink); box-shadow:0 24px 64px -16px rgba(43,36,21,.35);
  }
  dialog[open] { animation:pop .22s var(--ease); }
  dialog::backdrop { background:rgba(43,36,21,.32); backdrop-filter:blur(3px); }
  @keyframes pop { from { opacity:0; transform:scale(.96) translateY(8px); } }
  .dlg { padding:24px; display:flex; flex-direction:column; gap:16px; }
  .dlg h3 { font-size:19px; }
  .dlg-foot { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; flex-wrap:wrap; }
  .dlg-foot .spacer { flex:1; }

  .toast {
    position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:100; max-width:calc(100vw - 32px);
    transform:translate(-50%, 12px); opacity:0; pointer-events:none; padding:12px 18px; border-radius:99px;
    background:var(--ink); color:var(--paper); font-size:14px; box-shadow:0 10px 30px -10px rgba(43,36,21,.5);
    transition:opacity .2s var(--ease), transform .2s var(--ease);
  }
  .toast.show { opacity:1; transform:translate(-50%, 0); }
  .toast.bad { background:var(--danger); color:#fff; }

  @media (max-width:520px) {
    .stats { grid-template-columns:repeat(2, 1fr); row-gap:16px; }
    .hero-num { font-size:40px; }
    .veh-nums { grid-template-columns:repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div id="splash" class="splash"><span id="splashMsg">กำลังโหลด…</span><button id="splashRetry" class="btn hidden">ลองใหม่</button></div>

<section id="login" class="login hidden">
  <form id="loginForm" class="card login-card">
    <div class="emblem"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 14.5V21M9.6 11.3 3.4 9.6M14.4 11.3l6.2-1.7"/></svg></div>
    <h1>สมุดประจำรถ</h1>
    <p class="sub">บันทึกการใช้ บำรุงรักษา และซ่อมรถโรงงาน · TSM</p>
    <label class="field"><span>ชื่อผู้ใช้</span><input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="field"><span>รหัสผ่าน</span><input name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn primary block">เข้าสู่ระบบ</button>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div class="brand"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 14.5V21M9.6 11.3 3.4 9.6M14.4 11.3l6.2-1.7"/></svg></span>สมุดประจำรถ</div>
    <button class="me" id="meBtn" aria-label="บัญชีของฉัน"><span class="av" id="meAv"></span><b id="meName"></b></button>
  </header>

  <main>
    <!-- บันทึก -->
    <section id="v-record" class="view">
      <div class="page-head"><div><h2>บันทึกประจำวัน</h2><p class="meta" id="todayText"></p></div></div>
      <div id="recEmpty" class="card empty hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-6h14l2 6M3 13v5h2m16-5v5h-2M3 13h18M7 18h10"/><circle cx="7" cy="16" r="0.5"/><circle cx="17" cy="16" r="0.5"/></svg>
        <b>ยังไม่มีรถที่คุณประจำ</b><p>แจ้งผู้ดูแลระบบให้กำหนดรถให้คุณก่อนนะคะ</p>
      </div>
      <div id="recBody">
        <div class="plates" id="plates" role="listbox" aria-label="เลือกรถ"></div>
        <div class="card vehicle" id="vehCard"></div>
        <div class="seg" id="recSeg" style="margin-top:16px">
          <button type="button" data-t="usage">ใช้รถ</button><button type="button" data-t="fuel">เติมน้ำมัน</button><button type="button" data-t="repair">ซ่อม / บำรุง</button>
        </div>

        <form class="card form rec" data-table="usage" style="margin-top:12px">
          <label class="field"><span>วันที่</span><input type="date" name="date" required></label>
          <div class="row2">
            <label class="field"><span>ไมล์เริ่มต้น</span><input type="number" name="startKm" inputmode="decimal" step="any" min="0" required></label>
            <label class="field"><span>ไมล์สิ้นสุด</span><input type="number" name="endKm" inputmode="decimal" step="any" min="0" required></label>
          </div>
          <div class="calc" data-calc="distance"><span>ระยะทาง</span><span><b>–</b> กม.</span></div>
          <label class="field"><span>หมายเหตุ <i>(ไม่บังคับ)</i></span><input name="note" maxlength="300"></label>
          <button class="btn primary block">บันทึกการใช้รถ</button>
        </form>

        <form class="card form rec" data-table="fuel" style="margin-top:12px" hidden>
          <div class="row2">
            <label class="field"><span>วันที่</span><input type="date" name="date" required></label>
            <label class="field"><span>เลขไมล์ขณะเติม</span><input type="number" name="km" inputmode="decimal" step="any" min="0" required></label>
          </div>
          <div class="row2">
            <label class="field"><span>จำนวนลิตร</span><input type="number" name="liters" inputmode="decimal" step="any" min="0" required></label>
            <label class="field"><span>จำนวนเงิน (บาท)</span><input type="number" name="amount" inputmode="decimal" step="any" min="0" required></label>
          </div>
          <div class="calc" data-calc="price"><span>ราคาต่อลิตร</span><span><b>–</b> บาท</span></div>
          <label class="field"><span>ปั๊ม <i>(ไม่บังคับ)</i></span><input name="station" maxlength="300" placeholder="เช่น ปตท. สาขาบายพาส"></label>
          <label class="field"><span>หมายเหตุ <i>(ไม่บังคับ)</i></span><input name="note" maxlength="300"></label>
          <button class="btn primary block">บันทึกค่าน้ำมัน</button>
        </form>

        <form class="card form rec" data-table="repair" style="margin-top:12px" hidden>
          <div class="seg">
            <label><input type="radio" name="kind" value="บำรุงรักษา" checked>บำรุงรักษา</label>
            <label><input type="radio" name="kind" value="ซ่อม">ซ่อม</label>
          </div>
          <div class="row2">
            <label class="field"><span>วันที่</span><input type="date" name="date" required></label>
            <label class="field"><span>เลขไมล์</span><input type="number" name="km" inputmode="decimal" step="any" min="0" required></label>
          </div>
          <label class="field"><span>รายละเอียดงาน</span><textarea name="detail" required maxlength="1000" placeholder="เช่น เปลี่ยนน้ำมันเครื่อง + กรองน้ำมันเครื่อง"></textarea></label>
          <div class="row2">
            <label class="field"><span>อู่ / ร้าน <i>(ไม่บังคับ)</i></span><input name="shop" maxlength="300"></label>
            <label class="field"><span>ค่าใช้จ่าย (บาท)</span><input type="number" name="cost" inputmode="decimal" step="any" min="0" required></label>
          </div>
          <div class="field only-service">
            <label class="field"><span>นัดบำรุงรักษาครั้งถัดไปที่เลขไมล์ <i>(ไม่บังคับ)</i></span><input type="number" name="nextKm" inputmode="decimal" step="any" min="0"></label>
            <div class="quick"><button type="button" class="btn sm" data-add="5000">+5,000 กม.</button><button type="button" class="btn sm" data-add="10000">+10,000 กม.</button></div>
          </div>
          <button class="btn primary block">บันทึกงานซ่อม / บำรุง</button>
        </form>
      </div>
    </section>

    <!-- ประวัติ -->
    <section id="v-history" class="view">
      <div class="page-head"><h2>ประวัติ</h2></div>
      <div class="filters">
        <div class="seg" id="hisSeg"><button type="button" data-t="usage">ใช้รถ</button><button type="button" data-t="fuel">น้ำมัน</button><button type="button" data-t="repair">ซ่อม / บำรุง</button></div>
        <div class="row2"><select class="input" id="hisPlate" aria-label="ทะเบียนรถ"></select><input class="input" type="month" id="hisMonth" aria-label="เดือน"></div>
      </div>
      <div class="sum" id="hisSum"></div>
      <div class="card list" id="hisList"></div>
    </section>

    <!-- ภาพรวม -->
    <section id="v-dash" class="view">
      <div class="page-head"><div><h2>ภาพรวม</h2><p class="meta" id="dashSub"></p></div><input class="input" type="month" id="dashMonth" aria-label="เดือน"></div>
      <div id="dashBody" style="display:flex;flex-direction:column;gap:16px"></div>
    </section>

    <!-- ผู้ดูแล -->
    <section id="v-admin" class="view">
      <div class="page-head"><h2>ผู้ดูแลระบบ</h2></div>
      <div class="adm-bar">
        <div class="seg" id="admSeg"><button type="button" data-t="vehicles">รถ</button><button type="button" data-t="users">ผู้ใช้</button></div>
        <button class="btn gold" id="admAdd">+ เพิ่ม</button>
      </div>
      <div class="card list" id="admList"></div>
    </section>
  </main>

  <nav class="tabs" id="tabs">
    <button data-view="record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>บันทึก</button>
    <button data-view="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>ประวัติ</button>
    <button data-view="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>ภาพรวม</button>
    <button data-view="admin" id="tabAdmin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5Z"/><path d="m9 12 2 2 4-4"/></svg>ผู้ดูแล</button>
  </nav>
</div>

<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
